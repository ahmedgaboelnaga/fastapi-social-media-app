services: 
    api: 
        build: .
        depends_on:
            - postgres
        ports: 
            - 8000:8000
        volumes:
            - ./app:/code/app:ro
        command: ["/code/.venv/bin/uvicorn", "app.main:app", "--reload", "--host", "0.0.0.0", "--port", "8000"]
        env_file:
            - ./.env

    
    postgres:
        image: postgres:16-bullseye
        ports:
            - 5432:5432
        environment:
            - POSTGRES_PASSWORD=645798
            - POSTGRES_DB=fastapi
        volumes:
            - fastapi_social_media_postgres_data:/var/lib/postgresql/data

volumes:
    fastapi_social_media_postgres_data:
