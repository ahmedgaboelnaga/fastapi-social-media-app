{% extends "base.html" %}

{% block title %}Profile - FastAPI Social Media{% endblock %}

{% block extra_css %}
<style>
    .profile-container {
        max-width: 600px;
        margin: 2rem auto;
    }
    .profile-header {
        display: flex;
        align-items: center;
        gap: 2rem;
        margin-bottom: 2rem;
    }
    .profile-avatar-large {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.5rem;
        font-weight: bold;
    }
    .profile-info {
        flex: 1;
    }
    .profile-username {
        font-size: 1.5rem;
        font-weight: 300;
        margin-bottom: 0.5rem;
    }
    .profile-meta {
        color: var(--text-secondary);
        font-size: 0.9rem;
        margin-bottom: 1.5rem;
    }
    .profile-meta-item {
        margin-right: 1.5rem;
    }
    .profile-actions {
        display: flex;
        gap: 0.5rem;
    }
    @media (max-width: 600px) {
        .profile-header {
            flex-direction: column;
            text-align: center;
        }
        .profile-actions {
            justify-content: center;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="profile-container">
    <div class="card" style="padding: 2rem;">
        <div id="loading-profile" class="spinner-container">
            <div class="spinner"></div>
        </div>

        <div id="profile-content" class="hidden">
            <div class="profile-header">
                <div class="profile-avatar-large" id="profile-avatar">
                   ?
                </div>
                <div class="profile-info">
                    <h1 class="profile-username" id="profile-email">Loading...</h1>
                    <div class="profile-meta">
                         <span class="profile-meta-item">
                            <strong>ID:</strong> <span id="profile-id">--</span>
                         </span>
                         <span class="profile-meta-item">
                            <strong>Joined:</strong> <span id="profile-joined">--</span>
                        </span>
                    </div>
                    <div class="profile-actions">
                        <a href="/my-posts" class="btn btn-primary btn-sm">View My Posts</a>
                        <button class="btn btn-danger-outline btn-sm" onclick="logout()">Log Out</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="error-state" class="hidden text-center">
            <h3>Failed to load profile</h3>
            <button class="btn btn-primary" onclick="loadProfile()">Retry</button>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
async function loadProfile() {
    const token = getToken();
    
    if (!token) {
        window.location.href = '/login';
        return;
    }
    
    try {
        const response = await apiRequest('/users/me');
        
        if (response.ok) {
            const user = await response.json();
            
            // Update UI
            document.getElementById('profile-email').textContent = user.email;
            document.getElementById('profile-id').textContent = user.id;
            
            // Format date properly
            const date = new Date(user.created_at);
            document.getElementById('profile-joined').textContent = date.toLocaleDateString('en-US', { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
            
            // Avatar letter
            const initial = user.email.charAt(0).toUpperCase();
            document.getElementById('profile-avatar').textContent = initial;
            
            // Store user ID for consistency
            localStorage.setItem('user_id', user.id);
            localStorage.setItem('user_email', user.email);
            
            document.getElementById('loading-profile').classList.add('hidden');
            document.getElementById('profile-content').classList.remove('hidden');
        }
    } catch (error) {
        document.getElementById('loading-profile').classList.add('hidden');
        document.getElementById('error-state').classList.remove('hidden');
    }
}

document.addEventListener('DOMContentLoaded', () => {
    loadProfile();
});
</script>
{% endblock %}
