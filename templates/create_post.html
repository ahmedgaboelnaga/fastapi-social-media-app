{% extends "base.html" %}

{% block title %}Create Post - FastAPI Social Media{% endblock %}

{% block content %}
<div style="max-width: 800px; margin: 0 auto;">
    <h1 class="page-title">Create New Post</h1>
    
    <div class="card">
        <form id="create-post-form" onsubmit="handleCreatePost(event)">
            <div class="form-group">
                <label for="title" class="form-label">Title</label>
                <input 
                    type="text" 
                    id="title" 
                    name="title"
                    class="form-input" 
                    placeholder="Enter post title"
                    required
                    maxlength="200"
                >
            </div>

            <div class="form-group">
                <label for="content" class="form-label">Content</label>
                <textarea 
                    id="content" 
                    name="content"
                    class="form-textarea" 
                    placeholder="What's on your mind?"
                    required
                    rows="8"
                ></textarea>
            </div>

            <div style="display: flex; gap: 1rem;">
                <button type="submit" class="btn btn-primary">
                    ✓ Publish Post
                </button>
                <a href="/" class="btn btn-secondary">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
// Check if user is logged in
document.addEventListener('DOMContentLoaded', () => {
    const token = localStorage.getItem('access_token');
    if (!token) {
        showAlert('Please login to create a post', 'error');
        setTimeout(() => {
            window.location.href = '/login';
        }, 1500);
    }
});

async function handleCreatePost(event) {
    event.preventDefault();
    
    const formData = new FormData(event.target);
    const data = {
        title: formData.get('title'),
        content: formData.get('content')
    };
    
    const token = localStorage.getItem('access_token');
    
    try {
        const response = await fetch('/posts', {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        });
        
        if (response.ok) {
            showAlert('Post created successfully!', 'success');
            setTimeout(() => {
                window.location.href = '/';
            }, 1000);
        } else if (response.status === 401) {
            showAlert('Session expired. Please login again.', 'error');
            localStorage.removeItem('access_token');
            localStorage.removeItem('token_type');
            setTimeout(() => {
                window.location.href = '/login';
            }, 1500);
        } else {
            const error = await response.json();
            showAlert(error.detail || 'Failed to create post', 'error');
        }
    } catch (error) {
        showAlert('An error occurred. Please try again.', 'error');
    }
}
</script>
{% endblock %}
